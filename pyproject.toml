[project]
name = "journeyprices"
version = "0.1.0"
description = "Compares real cost, time, and value across transport options."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
]

[dependency-groups]
# Development tools. uv installs this group by default with `uv sync`.
dev = [
    "ruff>=0.17.4",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
]

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transport_modalities"]

[tool.ruff]
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes: unused imports, undefined names
    "I",   # import sorting
    "UP",  # use modern Python syntax
    "B",   # bugbear: likely bugs
    "SIM", # simpler equivalent code
]

[tool.mypy]
python_version = "3.14"
strict = true
# The code imports from `src` as its root, for example `from units import ...`.
# These two settings tell mypy to resolve modules the same way.
mypy_path = "src"
explicit_package_bases = true
exclude = ["^\\.venv/"]
