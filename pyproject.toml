[project]
name = "journeyprices"
version = "0.1.0"
description = "Compares real cost, time, and value across transport options."
requires-python = ">=3.13"
dependencies = [
    "flask",
]

[project.optional-dependencies]
dev = [
    "ruff==0.15.22",
    "mypy==2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transport_modalities"]

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true

[tool.ruff]
src = ["src"]
